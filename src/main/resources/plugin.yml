name: BosketBall
version: '3.0.0'
main: fr.bosketball.BosketBallPlugin
api-version: '1.21'
authors:
  - BosketBall
description: Competitive Multiplayer Basketball Server Engine (Ranked Queues, Locker Room, Coins Shop, Tags & Custom Arenas)

commands:
  bosketball:
    description: Main BosketBall command (Play, Locker Room, Shop, Tags, Stats, Party & Arenas)
    aliases: [bb, basket, hoops]
    usage: /bb [play|locker|shop|tags|ball|dunk|stats|history|friends|party|settings|top|practice|bot|3pt|duel|coins|map|arena]
  discord:
    description: Get the official BosketBall Discord invite link
    aliases: [dc]
    usage: /discord
  gg:
    description: Send GG at the end of a match (+Coins & XP)
    usage: /gg

permissions:
  bosketball.play:
    description: Allows playing BosketBall and opening server menus
    default: true
  bosketball.admin:
    description: Full BosketBall administration (arenas, maps, ranks, coins & match control)
    default: op
