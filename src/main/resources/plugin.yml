name: BosketBall
version: '3.7.0'
main: fr.bosketball.BosketBallPlugin
api-version: '26.2'
authors:
  - BosketBall
description: "Basketball compétitif : files classées, cosmétiques, saison"

commands:
  help:
    description: "Aide et liste des commandes"
    aliases: ['?']
    usage: /help
  play:
    description: "Choisir un mode de jeu"
    usage: /play [1v1|2v2|3v3|5v5|3pt|practice]
  practice:
    description: "Terrain d'entraînement solo"
    usage: /practice
  locker:
    description: "Tes cosmétiques"
    usage: /locker
  leave:
    description: "Quitter le match, la file ou le mode spectateur"
    usage: /leave
  spawn:
    description: "Retour au lobby"
    aliases: [hub, lobby]
    usage: /spawn
  shop:
    description: "Boutique de cosmétiques"
    usage: /shop [all|balls|dunks|tags]
  stats:
    description: "Ta fiche de joueur"
    aliases: [profil, profile]
    usage: /stats [joueur]
  ranks:
    description: "Les rangs ELO, de Rookie à MVP"
    usage: /ranks
  friend:
    description: "Amis"
    aliases: [f, friends]
    usage: /friend [add|remove|decline] [player]
  party:
    description: "Groupe : inviter, rejoindre, nommer"
    aliases: [p]
    usage: /party [name|invite|join|leave] [value]
  duel:
    description: "Défier un joueur en 1v1"
    usage: /duel <player>
  msg:
    description: "Message privé"
    aliases: [tell, w]
    usage: /msg <player> <message>
  reply:
    description: "Répondre au dernier message privé"
    aliases: [r]
    usage: /r <message>
  gg:
    description: "Dire GG en fin de match (+pièces)"
    usage: /gg
  discord:
    description: "Le Discord du serveur"
    usage: /discord
  pack:
    description: "Recharger le resource pack"
    usage: /pack
  bosketball:
    description: "Administration et outils d'arène (staff)"
    aliases: [bb]
    permission: bosketball.admin
    usage: /bb <admin|map|arena|holo|maintenance|mutechat|rank|coins|tag|save|reload>
  build:
    description: "Mode construction (staff)"
    permission: bosketball.admin
    usage: /build [player]
  setspawn:
    description: "Définir le spawn du lobby (staff)"
    permission: bosketball.admin
    usage: /setspawn
  perm:
    description: "Groupes de permissions (staff)"
    permission: bosketball.admin
    usage: /perm <user|group|list|reload> ...

  accept:
    description: "Accepter un match trouvé"
    usage: /accept
  decline:
    description: "Refuser un match trouvé"
    usage: /decline
  pc:
    description: "Chat de groupe uniquement"
    aliases: [pchat]
    usage: /pc
  tuto:
    description: "Tutoriel guidé"
    aliases: [tutorial]
    usage: /tuto [start|next|skip|stop]
  quests:
    description: "Quêtes du jour et de la semaine"
    aliases: [quest, objectives]
    usage: /quests
  achievements:
    description: "Succès"
    aliases: [ach]
    usage: /achievements
  season:
    description: "Saison classée"
    aliases: [saison]
    usage: /season [top|claim|end|start|days]
  report:
    description: "Signaler un joueur"
    usage: /report <player> <reason>
  crate:
    description: "Caisse de récompense"
    usage: /crate [open]
  mail:
    description: "Boîte aux lettres"
    aliases: [inbox, mailbox]
    usage: /mail
  guild:
    description: "Guilde"
    aliases: [team, g, gc]
    usage: /guild <create|invite|leave|info>
  ignore:
    description: "Ignorer un joueur"
    usage: /ignore <player>
  reports:
    description: "Signalements (staff)"
    permission: bosketball.staff
    usage: /reports
  afk:
    description: "Statut absent"
    usage: /afk
  status:
    description: "Diagnostic du serveur (staff)"
    permission: bosketball.staff
    usage: /status
  backup:
    description: "Sauvegarde immédiate (staff)"
    permission: bosketball.admin
    usage: /backup
  giveelo:
    description: "Donner de l'ELO (staff)"
    permission: bosketball.admin
    usage: /giveelo <player> <amount>
  warn:
    description: "Avertir un joueur (staff)"
    permission: bosketball.staff
    usage: /warn <player> [reason]
  unwarn:
    description: "Retirer un avertissement (staff)"
    permission: bosketball.staff
    usage: /unwarn <player> [all]
  warnings:
    description: "Avertissements (staff)"
    permission: bosketball.staff
    aliases: [warns]
    usage: /warnings

permissions:
  bosketball.play:
    description: "Avertissements (staff)"
    default: true
  bosketball.build:
    description: "Avertissements (staff)"
    default: op
  bosketball.map:
    description: "Avertissements (staff)"
    default: op
  bosketball.staff:
    description: "Avertissements (staff)"
    default: op
    # Umbrella children: LuckPerms/PermissionsEx expand them the same way.
    children:
      bosketball.staff.reports: true
      bosketball.staff.warn: true
      bosketball.staff.mute: true
      bosketball.staff.vanish: true
      bosketball.staff.freeze: true
      bosketball.staff.spectate: true
      bosketball.staff.match: true
      bosketball.staff.bypass: true
  bosketball.staff.reports:
    description: "Avertissements (staff)"
    default: op
  bosketball.staff.warn:
    description: "Avertissements (staff)"
    default: op
  bosketball.staff.mute:
    description: "Avertissements (staff)"
    default: op
  bosketball.staff.vanish:
    description: "Avertissements (staff)"
    default: op
  bosketball.staff.freeze:
    description: "Avertissements (staff)"
    default: op
  bosketball.staff.spectate:
    description: "Avertissements (staff)"
    default: op
  bosketball.staff.match:
    description: "Avertissements (staff)"
    default: op
  bosketball.staff.bypass:
    description: "Avertissements (staff)"
    default: op
  bosketball.admin:
    description: "Avertissements (staff)"
    default: op
    children:
      bosketball.admin.coins: true
      bosketball.admin.elo: true
      bosketball.admin.rank: true
      bosketball.admin.tags: true
      bosketball.admin.season: true
      bosketball.admin.holo: true
      bosketball.admin.arena: true
      bosketball.admin.reload: true
      bosketball.admin.maintenance: true
      bosketball.admin.mutechat: true
      bosketball.admin.stress: true
      bosketball.admin.backup: true
      bosketball.admin.audit: true
      bosketball.admin.displays: true
      bosketball.admin.items: true
      bosketball.admin.match: true
      bosketball.admin.profiler: true
      bosketball.admin.perms: true
  bosketball.admin.coins:
    description: "Avertissements (staff)"
    default: op
  bosketball.admin.elo:
    description: "Avertissements (staff)"
    default: op
  bosketball.admin.rank:
    description: "Avertissements (staff)"
    default: op
  bosketball.admin.tags:
    description: "Avertissements (staff)"
    default: op
  bosketball.admin.season:
    description: "Avertissements (staff)"
    default: op
  bosketball.admin.holo:
    description: "Avertissements (staff)"
    default: op
  bosketball.admin.arena:
    description: "Avertissements (staff)"
    default: op
  bosketball.admin.reload:
    description: "Avertissements (staff)"
    default: op
  bosketball.admin.maintenance:
    description: "Avertissements (staff)"
    default: op
  bosketball.admin.mutechat:
    description: "Avertissements (staff)"
    default: op
  bosketball.admin.stress:
    description: "Avertissements (staff)"
    default: op
  bosketball.admin.backup:
    description: "Avertissements (staff)"
    default: op
  bosketball.admin.audit:
    description: "Avertissements (staff)"
    default: op
  bosketball.admin.displays:
    description: "Avertissements (staff)"
    default: op
  bosketball.admin.items:
    description: "Avertissements (staff)"
