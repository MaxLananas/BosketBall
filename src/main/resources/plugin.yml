name: BosketBall
version: '3.7.0'
main: fr.bosketball.BosketBallPlugin
api-version: '26.2'
authors:
  - BosketBall
description: Standalone Competitive Basketball Server Core (Ranked Queues, Goal Replays, 3D Locker Room, Shop, 3D Holograms, Permissions & World Protection)

commands:
  help:
    description: Open the interactive BosketBall Server Guide & Commands
    aliases: ['?']
    usage: /help
  play:
    description: Browse BosketBall game modes or queue directly
    usage: /play [1v1|2v2|3v3|5v5|3pt|practice]
  practice:
    description: Step onto an instant Solo Practice Court
    usage: /practice
  locker:
    description: Enter the Full-Body 3D Squad Locker Room
    usage: /locker
  leave:
    description: Leave your current match, spectator session, Locker Room or queue
    usage: /leave
  spawn:
    description: Teleport back to the BosketBall Lobby Spawn
    aliases: [hub, lobby]
    usage: /spawn
  shop:
    description: Open the BosketBall Cosmetics & Tag Shop
    usage: /shop [all|balls|dunks|tags]
  ranks:
    description: View ELO Ranks (Rookie to MVP), #1/#2/#3 Badges & Controls Guide
    usage: /ranks
  friend:
    description: Open your Friends List GUI or add/remove friends
    aliases: [f, friends]
    usage: /friend [add|remove|decline] [player]
  party:
    description: Manage your Party, invite friends & set your Custom Team Name
    aliases: [p]
    usage: /party [name|invite|join|leave] [value]
  duel:
    description: Challenge an online player to a 1v1 Duel
    usage: /duel <player>
  msg:
    description: Send a private message to an online player
    aliases: [tell, w]
    usage: /msg <player> <message>
  reply:
    description: Reply to your most recent private message
    aliases: [r]
    usage: /r <message>
  gg:
    description: Send GG at the end of a match (+Coins & XP)
    usage: /gg
  discord:
    description: Get the official BosketBall Discord invite link
    usage: /discord
  pack:
    description: Load or reload the official BosketBall Resource Pack
    usage: /pack
  bosketball:
    description: Operator Administration & Arena Architect Suite (OP Only)
    aliases: [bb]
    permission: bosketball.admin
    usage: /bb <admin|map|arena|holo|maintenance|mutechat|rank|coins|tag|save|reload>
  build:
    description: Toggle Operator Builder / Block Edit mode (OP Only, FAWE & Axiom compatible)
    permission: bosketball.admin
    usage: /build [player]
  setspawn:
    description: Set the BosketBall Lobby Spawn at your current location (OP Only)
    permission: bosketball.admin
    usage: /setspawn
  perm:
    description: Manage BosketBall standalone permission groups (OP Only)
    permission: bosketball.admin
    usage: /perm <user|group|list|reload> ...

  accept:
    description: Accept a found match proposal (matchmaking)
    usage: /accept
  decline:
    description: Decline a found match proposal (costs a small queue penalty)
    usage: /decline
  pc:
    description: Toggle party-only chat
    aliases: [pchat]
    usage: /pc
  tuto:
    description: Start or manage the optional guided tutorial
    aliases: [tutorial]
    usage: /tuto [start|next|skip|stop]
  quests:
    description: Open the Quest Board (daily / weekly / contracts)
    aliases: [quest, objectives]
    usage: /quests
  achievements:
    description: Browse your achievements & hauts faits
    aliases: [ach]
    usage: /achievements
  season:
    description: Open the Ranked Season hub — placements, tier track, rewards & standings
    aliases: [saison]
    usage: /season [top|claim|end|start|days]
  report:
    description: Report a player to the staff (also sent to Discord)
    usage: /report <player> <reason>
  crate:
    description: Info about the Reward Crate, or open it directly
    usage: /crate [open]
  mail:
    description: Open your mailbox (offline friend requests & party invites)
    aliases: [inbox, mailbox]
    usage: /mail
  guild:
    description: Create or manage your persistent Guild
    aliases: [team, g, gc]
    usage: /guild <create|invite|leave|info>
  ignore:
    description: Toggle ignoring a player's messages
    usage: /ignore <player>
  reports:
    description: Staff reports panel (OP Only)
    permission: bosketball.staff
    usage: /reports
  afk:
    description: Toggle your AFK status (also set automatically after 5 minutes idle)
    usage: /afk
  status:
    description: Server & database diagnostics (Staff Only)
    permission: bosketball.staff
    usage: /status
  backup:
    description: Write an immediate profile backup archive (OP Only)
    permission: bosketball.admin
    usage: /backup
  giveelo:
    description: Give ELO to a player (admin shortcut for /bb elo give)
    permission: bosketball.admin
    usage: /giveelo <player> <amount>
  warn:
    description: Warn a player (or list their warnings)
    permission: bosketball.staff
    usage: /warn <player> [reason]
  unwarn:
    description: Remove a warning (or every warning) from a player
    permission: bosketball.staff
    usage: /unwarn <player> [all]
  warnings:
    description: Open the staff warnings panel
    permission: bosketball.staff
    aliases: [warns]
    usage: /warnings

permissions:
  bosketball.play:
    description: "Join queues, courts, tournaments and every player menu"
    default: true
  bosketball.build:
    description: "Toggle /build: manual block edits with FAWE & Axiom"
    default: op
  bosketball.map:
    description: "Arena authoring: /bb map, /bb arena and the map editor"
    default: op
  bosketball.staff:
    description: "Umbrella node: every moderation tool (staff.*)"
    default: op
    # Umbrella children: LuckPerms/PermissionsEx expand them the same way.
    children:
      bosketball.staff.reports: true
      bosketball.staff.warn: true
      bosketball.staff.mute: true
      bosketball.staff.vanish: true
      bosketball.staff.freeze: true
      bosketball.staff.spectate: true
      bosketball.staff.match: true
      bosketball.staff.bypass: true
  bosketball.staff.reports:
    description: "Read and resolve /reports"
    default: op
  bosketball.staff.warn:
    description: "Warn, unwarn and list warnings"
    default: op
  bosketball.staff.mute:
    description: "Mute chat, bypass the mute and talk while muted"
    default: op
  bosketball.staff.vanish:
    description: "Vanish from the tab list and the lobby"
    default: op
  bosketball.staff.freeze:
    description: "Freeze / unfreeze a player and freeze a whole match"
    default: op
  bosketball.staff.spectate:
    description: "Spectate any court without playing"
    default: op
  bosketball.staff.match:
    description: "Supervise matches: force-start, stop and re-queue"
    default: op
  bosketball.staff.bypass:
    description: "Bypass lobby protection, illegal-item filters and build locks"
    default: op
  bosketball.admin:
    description: "Umbrella node: full BosketBall administration (admin.*)"
    default: op
    children:
      bosketball.admin.coins: true
      bosketball.admin.elo: true
      bosketball.admin.rank: true
      bosketball.admin.tags: true
      bosketball.admin.season: true
      bosketball.admin.holo: true
      bosketball.admin.arena: true
      bosketball.admin.reload: true
      bosketball.admin.maintenance: true
      bosketball.admin.mutechat: true
      bosketball.admin.stress: true
      bosketball.admin.backup: true
      bosketball.admin.audit: true
      bosketball.admin.displays: true
      bosketball.admin.items: true
      bosketball.admin.match: true
      bosketball.admin.profiler: true
      bosketball.admin.perms: true
  bosketball.admin.coins:
    description: "Give, take or set Coins on any profile"
    default: op
  bosketball.admin.elo:
    description: "Give, take or set ELO on any profile"
    default: op
  bosketball.admin.rank:
    description: "Assign staff ranks (/bb rank)"
    default: op
  bosketball.admin.tags:
    description: "Grant or revoke any chat tag"
    default: op
  bosketball.admin.season:
    description: "Start, end or reconfigure the ranked season"
    default: op
  bosketball.admin.holo:
    description: "Place, move or remove holograms and NPC stations"
    default: op
  bosketball.admin.arena:
    description: "Rebuild, repaste, delete or teleport to arenas"
    default: op
  bosketball.admin.reload:
    description: "Reload the configuration and push the resource pack"
    default: op
  bosketball.admin.maintenance:
    description: "Toggle maintenance mode (admins keep access)"
    default: op
  bosketball.admin.mutechat:
    description: "Mute or unmute the global chat"
    default: op
  bosketball.admin.stress:
    description: "Run the internal load simulation (/bb stress)"
    default: op
  bosketball.admin.backup:
    description: "Trigger an immediate data backup"
    default: op
  bosketball.admin.audit:
    description: "Open the diagnostic report (/bb audit)"
    default: op
  bosketball.admin.displays:
    description: "Inspect and rebuild HUDs, sidebars and displays"
    default: op
  bosketball.admin.items:
    description: "Spawn balls, dunks, tags and admin items, bypass cosmetic locks"
    default: op
  bosketball.admin.match:
    description: "Force-start, stop, save or fill matches with bots"
    default: op
  bosketball.admin.profiler:
    description: "Drive the internal tick profiler"
    default: op
  bosketball.admin.perms:
    description: "Manage groups and permissions (/perm)"
    default: op
  bosketball.cosmetics.all:
    description: "Every basketball skin and signature dunk unlocked"
    default: false
  bosketball.tags.all:
    description: "Every chat tag unlocked (except founder-only ones)"
    default: false
  bosketball.vip:
    description: "VIP tier marker used by the rank manager"
    default: false
  bosketball.founder:
    description: "Founder-only cosmetics, tags and badge"
    default: false
