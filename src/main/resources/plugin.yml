name: BosketBall
version: '3.7.0'
main: fr.bosketball.BosketBallPlugin
api-version: '26.2'
authors:
  - BosketBall
description: Standalone Competitive Basketball Server Core (Ranked Queues, Goal Replays, 3D Locker Room, Shop, 3D Holograms, Permissions & World Protection)

commands:
  help:
    description: Open the interactive BosketBall Server Guide & Commands
    aliases: ['?']
    usage: /help
  play:
    description: Browse BosketBall game modes or queue directly
    usage: /play [1v1|2v2|3v3|5v5|3pt|practice]
  practice:
    description: Step onto an instant Solo Practice Court
    usage: /practice
  locker:
    description: Enter the Full-Body 3D Squad Locker Room
    usage: /locker
  leave:
    description: Leave your current match, spectator session, Locker Room or queue
    usage: /leave
  spawn:
    description: Teleport back to the BosketBall Lobby Spawn
    aliases: [hub, lobby]
    usage: /spawn
  shop:
    description: Open the BosketBall Cosmetics & Tag Shop
    usage: /shop [all|balls|dunks|tags]
  ranks:
    description: View ELO Ranks (Rookie to MVP), #1/#2/#3 Badges & Controls Guide
    usage: /ranks
  friend:
    description: Open your Friends List GUI or add/remove friends
    aliases: [f, friends]
    usage: /friend [add|remove|decline] [player]
  party:
    description: Manage your Party, invite friends & set your Custom Team Name
    aliases: [p]
    usage: /party [name|invite|join|leave] [value]
  duel:
    description: Challenge an online player to a 1v1 Duel
    usage: /duel <player>
  msg:
    description: Send a private message to an online player
    aliases: [tell, w]
    usage: /msg <player> <message>
  reply:
    description: Reply to your most recent private message
    aliases: [r]
    usage: /r <message>
  gg:
    description: Send GG at the end of a match (+Coins & XP)
    usage: /gg
  discord:
    description: Get the official BosketBall Discord invite link
    usage: /discord
  pack:
    description: Load or reload the official BosketBall Resource Pack
    usage: /pack
  bosketball:
    description: Operator Administration & Arena Architect Suite (OP Only)
    aliases: [bb]
    permission: bosketball.admin
    usage: /bb <admin|map|arena|holo|maintenance|mutechat|rank|coins|tag|save|reload>
  build:
    description: Toggle Operator Builder / Block Edit mode (OP Only, FAWE & Axiom compatible)
    permission: bosketball.admin
    usage: /build [player]
  setspawn:
    description: Set the BosketBall Lobby Spawn at your current location (OP Only)
    permission: bosketball.admin
    usage: /setspawn
  perm:
    description: Manage BosketBall standalone permission groups (OP Only)
    permission: bosketball.admin
    usage: /perm <user|group|list|reload> ...

  accept:
    description: Accept a found match proposal (matchmaking)
    usage: /accept
  decline:
    description: Decline a found match proposal (costs a small queue penalty)
    usage: /decline
  pc:
    description: Toggle party-only chat
    aliases: [pchat]
    usage: /pc
  tuto:
    description: Start or manage the optional guided tutorial
    aliases: [tutorial]
    usage: /tuto [start|next|skip|stop]
  quests:
    description: Open the Quest Board (daily / weekly / contracts)
    aliases: [quest, objectives]
    usage: /quests
  achievements:
    description: Browse your achievements & hauts faits
    aliases: [ach]
    usage: /achievements
  report:
    description: Report a player to the staff (also sent to Discord)
    usage: /report <player> <reason>
  crate:
    description: Info about the Reward Crate, or open it directly
    usage: /crate [open]
  guild:
    description: Create or manage your persistent Guild
    aliases: [team]
    usage: /guild <create|invite|leave|info>
  ignore:
    description: Toggle ignoring a player's messages
    usage: /ignore <player>
  reports:
    description: Staff reports panel (OP Only)
    permission: bosketball.staff
    usage: /reports
  status:
    description: Server & database diagnostics (Staff Only)
    permission: bosketball.staff
    usage: /status
  backup:
    description: Write an immediate profile backup archive (OP Only)
    permission: bosketball.admin
    usage: /backup
  giveelo:
    description: Give ELO to a player (admin shortcut for /bb elo give)
    permission: bosketball.admin
    usage: /giveelo <player> <amount>
  warn:
    description: Warn a player (or list their warnings)
    permission: bosketball.staff
    usage: /warn <player> [reason]
  unwarn:
    description: Remove a warning (or every warning) from a player
    permission: bosketball.staff
    usage: /unwarn <player> [all]
  warnings:
    description: Open the staff warnings panel
    permission: bosketball.staff
    aliases: [warns]
    usage: /warnings

permissions:
  bosketball.play:
    description: Allows playing BosketBall and opening server menus
    default: true
  bosketball.build:
    description: Allows toggling /build mode and editing blocks with FAWE & Axiom
    default: op
  bosketball.staff:
    description: Moderation tools and match supervision
    default: op
  bosketball.admin:
    description: Full BosketBall server administration (OP Control Center, arenas, maps, holograms, ranks & coins)
    default: op
