name: BosketBall
version: '2.6.2-ULTRA'
main: fr.bosketball.BosketBallPlugin
api-version: '26.2'
authors:
  - BosketBallStudio
description: Jeu de Basket-Ball 3D complet nouvelle génération pour Paper 26.2 (Modèles 3D, HUD BossBar, Rangs, Physique & Arènes)

commands:
  bosketball:
    description: Commande principale BosketBall (Menu, Matchs, Arènes, Cosmétiques, Classements)
    aliases: [bb, basket, hoops]
    usage: /bb [menu|join|leave|play|practice|3pt|locker|stats|top|duel|pack|arena|rank|skin|dunk|giveball|forcestart|stop|reload]
  gg:
    description: Envoyer un GG stylisé en fin de match (+XP fair-play)
    usage: /gg

permissions:
  bosketball.play:
    description: Permet de jouer au Basket-Ball et d'ouvrir les menus
    default: true
  bosketball.admin:
    description: Administration complète des arènes, rangs et matchs BosketBall
    default: op
