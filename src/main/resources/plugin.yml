name: BosketBall
version: '3.1.0'
main: fr.bosketball.BosketBallPlugin
api-version: '1.21'
authors:
  - BosketBall
description: Standalone Competitive Basketball Server Core (Ranked Queues, Goal Replays, Locker Room, Shop, Permissions & World Protection)

commands:
  bosketball:
    description: Main BosketBall command (Play, Locker Room, Shop, Tags, Ranks, Friends, Party & Arenas)
    aliases: [bb, basket, hoops]
    usage: /bb [play|locker|shop|tags|ranks|friends|party|practice|3pt|duel|coins]
  play:
    description: Browse BosketBall game modes or queue directly
    usage: /play [1v1|2v2|3v3|5v5|3pt|practice]
  practice:
    description: Step onto a personal Solo Practice Court
    usage: /practice
  leave:
    description: Leave your current match or matchmaking queue
    usage: /leave
  shop:
    description: Open the BosketBall Cosmetics & Tag Shop
    aliases: [store]
    usage: /shop [all|balls|dunks|tags]
  ranks:
    description: View ELO Ranks (Rookie to MVP), #1/#2/#3 Badges & Controls Guide
    aliases: [elo, guide]
    usage: /ranks
  friend:
    description: Open your Friends List GUI or add/remove friends
    aliases: [f, friends]
    usage: /friend [add|remove|decline] [player]
  party:
    description: Manage your Party, invite friends & set your Custom Team Name
    aliases: [p]
    usage: /party [name|invite|join|leave] [value]
  build:
    description: Toggle Builder / Block Edit bypass mode (FAWE & Axiom compatible)
    aliases: [buildmode]
    usage: /build [player]
  spawn:
    description: Teleport back to the BosketBall Lobby Spawn
    aliases: [hub, lobby]
    usage: /spawn
  setspawn:
    description: Set the BosketBall Lobby Spawn at your current location
    usage: /setspawn
  perm:
    description: Manage BosketBall standalone permission groups and player permissions
    aliases: [perms, bperm]
    usage: /perm <user|group|list|reload> ...
  discord:
    description: Get the official BosketBall Discord invite link
    aliases: [dc]
    usage: /discord
  gg:
    description: Send GG at the end of a match (+Coins & XP)
    usage: /gg
  msg:
    description: Send a private message to an online player
    aliases: [tell, w, whisper, pm]
    usage: /msg <player> <message>
  reply:
    description: Reply to your most recent private message
    aliases: [r]
    usage: /r <message>

permissions:
  bosketball.play:
    description: Allows playing BosketBall and opening server menus
    default: true
  bosketball.build:
    description: Allows toggling /build mode and editing blocks with FAWE & Axiom
    default: op
  bosketball.staff:
    description: Moderation tools and match supervision
    default: op
  bosketball.admin:
    description: Full BosketBall server administration (permissions, protection, arenas, maps, ranks & coins)
    default: op
