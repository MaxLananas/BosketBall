# ===========================================================================
#   BOSKETBALL — MAIN SERVER CONFIGURATION
#   Reload changes live at any time with: /bb reload
#   Shop item prices (Tags, Basketballs, Dunk Styles) live in: shop.yml
#   Permissions & staff groups live in: permissions.yml
#   Arenas & custom maps live in: arenas.yml
#   Player profiles live in: players/<uuid>.yml (indexed in _name_index.yml)
# ===========================================================================

config-version: 3

# ---------------------------------------------------------------------------
# 1. GENERAL SERVER BRANDING & LOBBY
# ---------------------------------------------------------------------------
general:
  # Domain shown at the bottom of the Sidebar, [TAB] list & Server List MOTD
  server-domain: "BOSKETBALL.NET"

  # Active season label displayed in the [TAB] list footer
  season-name: "ꜱᴇᴀꜱᴏɴ ɪ"

  # Automatically equip BosketBall's 5-item menu hotbar when players join the lobby
  auto-equip-lobby-playbook: true

  # Starting Coin balance granted the very first time a player joins
  starting-coins: 100

# ---------------------------------------------------------------------------
# 2. SERVER LIST MOTD & 1:1 ICON (CYTOOXIEN-STYLE CENTERED GRADIENT BANNER)
# ---------------------------------------------------------------------------
motd:
  # Enable BosketBall's pixel-centered server list MOTD & automatic 1:1 server icon
  enabled: true

  # Automatically install BosketBall's 64x64 1:1 server-icon.png if missing
  auto-install-server-icon: true

  # Custom max-players count displayed in the server list (0 = use server.properties)
  max-players-display: 100

  # Line 1: Centered bold server domain header (MiniMessage gradients supported)
  header: "<gradient:#FFD43B:#FF8C1A><bold>BOSKETBALL.NET</bold></gradient>"

  # Line 2: Centered vibrant spectrum banner (rotates smoothly across pings)
  subtitles:
    - "<#22D3EE>✦</#22D3EE> <gradient:#FF5E5E:#FFB830:#6EE755:#2CE6FF:#5B8CFF><bold>COMPETITIVE 3D BASKETBALL</bold></gradient> <#22D3EE>✦</#22D3EE>"
    - "<#FFD43B>★</#FFD43B> <gradient:#FF8C1A:#FFD43B:#4ADE80:#38BDF8><bold>1V1 • 2V2 • 3V3 • 5V5 RANKED</bold></gradient> <#FFD43B>★</#FFD43B>"
    - "<#4ADE80>⚡</#4ADE80> <gradient:#FB7185:#FBBF24:#34D399:#60A5FA><bold>SLAM DUNKS • REPLAYS • COINS SHOP</bold></gradient> <#4ADE80>⚡</#4ADE80>"

  # Optional maintenance banner override
  maintenance-mode: false
  maintenance-subtitle: "<#F87171>⚠ <bold>SCHEDULED MAINTENANCE IN PROGRESS</bold> ⚠</#F87171>"

# ---------------------------------------------------------------------------
# 3. STANDALONE WORLD PROTECTION & BUILD MODE (FAWE + AXIOM COMPATIBLE)
# ---------------------------------------------------------------------------
protection:
  # Master world protection guard (designed for standalone servers running BosketBall + FAWE + Axiom)
  enabled: true

  # Freeze all block gravity (sand, gravel, concrete powder, anvils, dripstone) & fragile block physics
  disable-block-gravity: true

  # Block all fire ignition, burning, lava/fire spread, flint & steel, and fire charges
  disable-fire-and-spread: true

  # Block all explosions (TNT, crystals, creepers, beds, respawn anchors & fireballs)
  disable-explosions: true

  # Lock clear weather, prevent leaf decay, ice/snow melting, fluid griefing & natural mob spawns
  disable-weather-and-decay: true

  # Block dangerous/illegal items (TNT, End Crystals, Command Blocks, Lava Buckets, Spawn Eggs, etc.)
  block-illegal-items: true

  # Allow builders/admins with permission to use Axiom & FAWE seamlessly while manual block edits use /build
  allow-fawe-and-axiom-bypass: true

  # Automatically rescue falling players below this Y coordinate back to Lobby Spawn
  void-rescue-y: -16.0

# ---------------------------------------------------------------------------
# 4. JOIN WELCOME BANNER & COMMUNITY LINKS
# ---------------------------------------------------------------------------
welcome:
  # Show the crowned BOSKETBALL welcome card when a player joins
  enabled: true
  headline: "Welcome to BosketBall!"
  subtitle: "Queue 1v1–5v5, earn Coins on the court & unlock cosmetics in /shop."

links:
  website: "https://bosketball.net"
  shop: "https://store.bosketball.net"
  discord: "https://discord.gg/pnJhKuU2QK"

# ---------------------------------------------------------------------------
# 5. AUTOMATIC RESOURCE PACK DELIVERY
# ---------------------------------------------------------------------------
resource-pack:
  # Prompt players to download the BosketBall resource pack on join
  auto-send-on-join: true

  # Kick players who decline the resource pack if true
  required: false

  # Built-in HTTP server (zero external hosting needed — serves BosketBall-ResourcePack.zip)
  embedded-http-server:
    enabled: false
    bind-address: "0.0.0.0"
    port: 8765
    public-host: "127.0.0.1"

  # Optional external CDN / GitHub release URL (overrides embedded-http-server when set)
  external-url: ""
  external-sha1: "828a8af2ba2fa5989dd7d305ff86ae4de8045aa3"

# ---------------------------------------------------------------------------
# 6. MATCH RULES, GOAL REPLAYS & SCALABLE PRACTICE POOL
# ---------------------------------------------------------------------------
match:
  # Number of regulation quarters in team modes (2v2, 3v3, 5v5)
  quarters: 4

  # Duration of each regulation quarter (in seconds)
  quarter-seconds: 90

  # Duration of each overtime period when tied (in seconds)
  overtime-seconds: 45

  # Possession shot clock (in seconds)
  shot-clock-seconds: 24

  # Shot clock reset after an offensive rebound (in seconds)
  offensive-rebound-shot-clock: 14

  # Tip-off countdown before gameplay starts (in seconds)
  countdown-seconds: 5

  # Post-basket celebration & instant goal replay duration (in ticks; 20 ticks = 1 second)
  celebration-ticks: 80

  # Consecutive unanswered buckets required to ignite ON FIRE mode
  on-fire-streak-threshold: 3

  # Winning score cap in 1v1 Duel mode
  target-score-1v1: 21

  # Enable instant frame-by-frame Goal Replay after competitive baskets
  goal-replay-enabled: true

practice:
  # Dedicated void world hosting isolated Practice & 3PT Contest courts
  world-name: "bosketball_practice"

  # Maximum concurrent isolated Practice / 3PT courts generated on demand
  max-instances: 64

  # Grid spacing (in blocks) between isolated Practice courts
  grid-spacing-blocks: 200

# ---------------------------------------------------------------------------
# 7. COIN ECONOMY (STAKES, REWARDS & PENALTIES)
#    Player balances never drop below 0 Coins.
#    Customize Shop item prices in plugins/BosketBall/shop.yml!
# ---------------------------------------------------------------------------
economy:
  # End-of-match rewards & forfeit penalty (competitive 1v1 / 2v2 / 3v3 / 5v5)
  win-coins: 40
  loss-coins: 0
  forfeit-coins: 15
  mvp-bonus-coins: 15

  # Live on-court play rewards (competitive matches)
  two-point-coins: 5
  three-point-coins: 8
  dunk-bonus-coins: 3
  assist-coins: 4
  steal-coins: 4
  block-coins: 4

  # Solo & sportsmanship rewards
  three-point-contest-max-coins: 25
  gg-reward-coins: 5

# ---------------------------------------------------------------------------
# 8. 80HZ BALL PHYSICS & SKILL COOLDOWNS
# ---------------------------------------------------------------------------
physics:
  # Downward acceleration per tick (default: 0.046)
  gravity: 0.046

  # Air resistance multiplier per tick (0.90 = heavy drag, 0.999 = almost none)
  air-drag: 0.991

  # Bounce energy retained on court floor, backboard glass, and steel rim (0.10 - 0.95)
  floor-restitution: 0.76
  backboard-restitution: 0.66
  rim-restitution: 0.56

  # Skill move cooldowns (in milliseconds)
  steal-cooldown-ms: 1150
  crossover-cooldown-ms: 1650
  block-cooldown-ms: 900

# ---------------------------------------------------------------------------
# 9. CHAT FORMATTING, [+] / [-] JOIN-QUIT & POST-GAME CLEANUP
# ---------------------------------------------------------------------------
chat:
  # Enable BosketBall's single-line [Rank] [Tag] Player » message chat renderer
  enabled: true

  # Clean [+] join and [-] leave broadcast messages
  join-quit-messages: true
  join-format: "<dark_gray>[</dark_gray><#4ADE80><bold>+</bold></#4ADE80><dark_gray>]</dark_gray> <white>{player}</white>"
  quit-format: "<dark_gray>[</dark_gray><#F87171><bold>-</bold></#F87171><dark_gray>]</dark_gray> <gray>{player}</gray>"

  # Flush match play-by-play lines from chat when a game finishes or a player leaves court
  clear-after-match: true

  # Display Top-3 server leaderboard badges next to top players in chat
  show-top-stat-badges: true

  # Words automatically highlighted in gold when typed in chat
  highlight-keywords:
    - "GG"
    - "NICE SHOT"
    - "SPLASH"
    - "SWISH"
    - "DUNK"
    - "ANKLES"
    - "GREEN"

# ---------------------------------------------------------------------------
# 10. DATA STORAGE & AUTO-SAVE
# ---------------------------------------------------------------------------
storage:
  # Interval between background dirty-profile disk flushes (in seconds)
  auto-save-interval-seconds: 30

  # Maximum recent match history entries stored per player
  max-match-history: 15
