# ===========================================================================
#   BOSKETBALL — MAIN SERVER CONFIGURATION
#   Reload changes live at any time with: /bb reload
#   Shop item prices (Tags, Basketballs, Dunk Styles) live in: shop.yml
#   Permissions & staff groups live in: permissions.yml
#   Arenas & custom maps live in: arenas.yml
#   Player profiles live in: players/<uuid>.yml (indexed in _name_index.yml)
# ===========================================================================

config-version: 6

# ---------------------------------------------------------------------------
# 1. GENERAL SERVER BRANDING & LOBBY
# ---------------------------------------------------------------------------
general:
  # Domain shown at the bottom of the Sidebar, [TAB] list & Server List MOTD.
  # Lower case is preserved verbatim in the [TAB] footer (players connect to it), so the real
  # join address belongs here — not a marketing name in capitals.
  server-domain: "bosketball.mc-hosting.xyz"

  # Active season label displayed in the [TAB] list footer
  season-name: "ꜱᴇᴀꜱᴏɴ ɪ"

  # Automatically equip BosketBall's 5-item menu hotbar when players join the lobby
  auto-equip-lobby-playbook: true

  # Starting Coin balance granted the very first time a player joins
  starting-coins: 100

  # Default interface language. "en" is the base language, "fr" the full translation.
  # Players override it per-account in /settings (NEW).
  language: "en"

# ---------------------------------------------------------------------------
# 1B. LOBBY LAYOUT — FORCED SERVER SPAWN & NPC STATIONS (PLAY / SHOP)
# ---------------------------------------------------------------------------
# These coordinates pin the lobby layout of the official BosketBall map.
# With "enforce" enabled they always win over /setspawn and holograms.yml,
# so EVERY player who joins the server is placed exactly at the spawn point
# below, and the two clickable 3D NPC stations (superstar = Play menu,
# merchant = Shop) + their floating holograms are re-created at
# their exact position & facing on every server start (/bb reload applies).
# Set an "enforce" flag to false to manage the spawn / NPCs by hand instead
# (legacy behaviour: /setspawn + /bb holo play|shop stored in spawn.yml /
# holograms.yml). x/z use block centers (+0.5); yaw: -90 = East, 0 = South.
lobby:
  spawn:
    enforce: true
    world: "world"
    x: 89.5
    y: 63.0
    z: 61.5
    # Facing east (-90), looking straight at the Play & Shop NPCs
    yaw: -90.0
    pitch: 0.0
  stations:
    enforce: true
    # "Play" superstar NPC (opens the Play modes menu on click)
    play:
      world: "world"
      x: 119.5
      y: 62.0
      z: 56.5
      yaw: 79.0
      pitch: -1.1
    # "Shop" merchant NPC (opens the Shop on click)
    shop:
      world: "world"
      x: 119.5
      y: 62.0
      z: 66.5
      yaw: 103.5
      pitch: -0.5

  # -------------------------------------------------------------------------
  # NEW LOBBY STATIONS (all optional, each one is a clickable 3D hologram)
  # x/z are block centers (+0.5). "y" is the FLOOR block: BosketBall lifts the
  # hologram 2 blocks above it automatically. Facing default = WEST (-1,0,0).
  # -------------------------------------------------------------------------
  stations-extra:
    enforce: true
    # Interactive reward crate — opens for Coins, see the "crates" section
    crate:
      enabled: true
      world: "world"
      x: 120.5
      y: 62.0
      z: 61.5
      # Height of the crate body above the floor block (1.0 = a chest resting on the pedestal)
      lift: 1.0
      facing: "west"
    # Tutorial guide hologram (/tuto) — purely informative, never forced
    tutorial:
      enabled: true
      world: "world"
      x: 101.5
      y: 61.0
      z: 61.5
      facing: "west"
    # Server leaderboards wall (already pinned by /bb holo elo|points|coins)
    hall-of-fame:
      enabled: false
      world: "world"
      x: 0.5
      y: 64.0
      z: 0.5
      facing: "south"

# ---------------------------------------------------------------------------
# 2. SERVER LIST MOTD & 1:1 ICON (CYTOOXIEN-STYLE CENTERED GRADIENT BANNER)
# ---------------------------------------------------------------------------
motd:
  # Enable BosketBall's pixel-centered server list MOTD & automatic 1:1 server icon
  enabled: true

  # Automatically install BosketBall's 64x64 1:1 server-icon.png if missing
  auto-install-server-icon: true

  # Custom max-players count displayed in the server list (0 = use server.properties)
  max-players-display: 100

  # Line 1: Centered bold server domain header (MiniMessage gradients supported)
  header: "<gradient:#FFD43B:#FF8C1A><bold>BOSKETBALL.NET</bold></gradient>"

  # Line 2: Centered vibrant spectrum banner (rotates smoothly across pings)
  subtitles:
    - "<#22D3EE>✦</#22D3EE> <gradient:#FF5E5E:#FFB830:#6EE755:#2CE6FF:#5B8CFF><bold>COMPETITIVE 3D BASKETBALL</bold></gradient> <#22D3EE>✦</#22D3EE>"
    - "<#FFD43B>★</#FFD43B> <gradient:#FF8C1A:#FFD43B:#4ADE80:#38BDF8><bold>1V1 • 2V2 • 3V3 • 5V5 RANKED</bold></gradient> <#FFD43B>★</#FFD43B>"
    - "<#4ADE80>⚡</#4ADE80> <gradient:#FB7185:#FBBF24:#34D399:#60A5FA><bold>SLAM DUNKS • REPLAYS • COINS SHOP</bold></gradient> <#4ADE80>⚡</#4ADE80>"

  # Optional maintenance banner override
  maintenance-mode: false
  maintenance-subtitle: "<#F87171>⚠ <bold>SCHEDULED MAINTENANCE IN PROGRESS</bold> ⚠</#F87171>"

# ---------------------------------------------------------------------------
# 3. STANDALONE WORLD PROTECTION & BUILD MODE (FAWE + AXIOM COMPATIBLE)
# ---------------------------------------------------------------------------
protection:
  # Master world protection guard (designed for standalone servers running BosketBall + FAWE + Axiom)
  enabled: true

  # Freeze all block gravity (sand, gravel, concrete powder, anvils, dripstone) & fragile block physics
  disable-block-gravity: true

  # Block all fire ignition, burning, lava/fire spread, flint & steel, and fire charges
  disable-fire-and-spread: true

  # Block all explosions (TNT, crystals, creepers, beds, respawn anchors & fireballs)
  disable-explosions: true

  # Lock clear weather, prevent leaf decay, ice/snow melting, fluid griefing & natural mob spawns
  disable-weather-and-decay: true

  # Block dangerous/illegal items (TNT, End Crystals, Command Blocks, Lava Buckets, Spawn Eggs, etc.)
  block-illegal-items: true

  # Allow builders/admins with permission to use Axiom & FAWE seamlessly while manual block edits use /build
  allow-fawe-and-axiom-bypass: true

  # Automatically rescue falling players below this Y coordinate back to Lobby Spawn
  void-rescue-y: -16.0

# ---------------------------------------------------------------------------
# 4. JOIN WELCOME BANNER & COMMUNITY LINKS
# ---------------------------------------------------------------------------
welcome:
  # Show the crowned BOSKETBALL welcome card when a player joins
  enabled: true
  headline: "Welcome to BosketBall!"
  subtitle: "Queue 1v1–5v5, earn Coins on the court & unlock cosmetics in /shop."

links:
  # Leave blank ("") to hide Website or Store on the Welcome Card until live
  website: ""
  shop: ""
  discord: "https://discord.gg/pnJhKuU2QK"

# ---------------------------------------------------------------------------
# 5. AUTOMATIC EMBEDDED RESOURCE PACK DELIVERY (ZERO-EXTRA-PORT READY)
#    BosketBall.jar automatically extracts BosketBall-ResourcePack.zip into
#    plugins/BosketBall/, multiplexes HTTP pack downloads directly over your
#    open Minecraft game port (works on Pterodactyl / firewalled game hosts
#    with ZERO extra ports!), and auto-retries fallback routes if needed.
# ---------------------------------------------------------------------------
resource-pack:
  # Prompt players to download the BosketBall resource pack on join
  auto-send-on-join: true

  # Kick players who decline the resource pack if true
  required: false

  # Built-in HTTP delivery (serves directly on the Minecraft game port first, plus fallback port)
  embedded-http-server:
    enabled: true
    bind-address: "0.0.0.0"
    port: 8765
    public-host: "auto"

  # Optional external CDN / GitHub release URL (overrides embedded-http-server when set)
  external-url: ""
  external-sha1: "488562602d099abbd1aaed358920a6acddff2b2f"

# ---------------------------------------------------------------------------
# 6. MATCH RULES, MATCHMAKING, GOAL REPLAYS & SCALABLE PRACTICE POOL
# ---------------------------------------------------------------------------
match:
  # Number of regulation quarters in team modes (2v2, 3v3, 5v5)
  quarters: 4

  # Duration of each regulation quarter (in seconds)
  quarter-seconds: 90

  # Duration of each overtime period when tied (in seconds)
  overtime-seconds: 45

  # Possession shot clock (in seconds)
  shot-clock-seconds: 24

  # Shot clock reset after an offensive rebound (in seconds)
  offensive-rebound-shot-clock: 14

  # Tip-off countdown before gameplay starts (in seconds)
  countdown-seconds: 5

  # Post-basket celebration & instant goal replay duration (in ticks; 20 ticks = 1 second)
  celebration-ticks: 80

  # Consecutive unanswered buckets required to ignite ON FIRE mode
  on-fire-streak-threshold: 3

  # Winning score cap in 1v1 Duel mode
  target-score-1v1: 21

  # Enable instant frame-by-frame Goal Replay after competitive baskets
  goal-replay-enabled: true

  # NEW — a competitor leaving inside this window cancels the match as a REMAKE
  # (no ELO change, no loss recorded). 0 disables remakes.
  remake-window-seconds: 60

  # NEW — minimum human players required to keep a match alive before it is remade
  remake-min-players: 2

# ---------------------------------------------------------------------------
# 6B. MATCHMAKING (ELO-WEIGHTED, ELASTIC WINDOW + ACCEPT PROMPT)  [NEW]
# ---------------------------------------------------------------------------
matchmaking:
  # Enable ELO-weighted matchmaking. false = legacy first-come-first-served.
  elo-weighted: true

  # Initial ELO window around the queueing player
  elo-window-start: 150

  # The window widens by this much every "expand-every-seconds"
  elo-window-growth: 50
  expand-every-seconds: 10

  # Hard cap so a Rookie can never be matched with a Legend even after a long wait
  elo-window-max: 600

  # Seconds a player can wait before the window is forced fully open
  max-wait-seconds: 180

  # NEW — accept / decline prompt ("dodge") before a match starts
  accept-prompt:
    enabled: true
    # Seconds players have to accept the found match
    timeout-seconds: 12

  # NEW — AI backfill: once a match is launched, empty slots are filled with CPU players
  # so nobody ever plays alone on a court. Set to false for a purists-only server.
  fill-bots-on-launch: true
  # Difficulty of the AI players: easy | normal | pro  (also settable per-match with /bb bot)
  bot-difficulty: normal
  # After this many seconds alone in queue, a solo player gets a CPU opponent
  backfill-bot-after-seconds: 90

  # NEW — queue penalty applied when a player declines a found match
  dodge-penalty-seconds: 180
  # Escalating penalty: each additional dodge in the same hour multiplies the penalty
  dodge-penalty-multiplier: 2
  # Decay window for the dodge counter
  dodge-counter-reset-minutes: 60

# ---------------------------------------------------------------------------
# 6C. PROGRESSION: QUESTS, ACHIEVEMENTS, DAILY LOGIN  [NEW]
# ---------------------------------------------------------------------------
progression:
  enabled: true

  quests:
    enabled: true
    daily-count: 3
    weekly-count: 3
    contract-count: 2
    # Cost in Coins to reroll one contract slot
    contract-reroll-cost: 75
    # Announce a completed quest in chat
    announce-completions: true

  achievements:
    enabled: true
    # Broadcast an unlocked achievement to the whole server
    broadcast-unlocks: false

  daily-login:
    enabled: true
    # Coin rewards for a 7-day streak (loops after day 7)
    streak-rewards: [40, 55, 70, 90, 110, 140, 200]

# ---------------------------------------------------------------------------
# 6D. REWARD CRATE (lobby station)  [NEW]
# ---------------------------------------------------------------------------
crates:
  enabled: true
  # Coins paid per single opening
  cost-coins: 250
  # Maximum openings per player per day
  daily-limit: 5
  # Seconds between two openings (anti-spam)
  cooldown-seconds: 3
  # Minimum / maximum coins a crate can refund
  coin-min: 60
  coin-max: 500
  # Chance (0.0 - 1.0) to drop a cosmetic (ball / dunk / tag) instead of coins
  cosmetic-chance: 0.22
  # Chance (0.0 - 1.0) to drop a rare bonus on top of the main reward
  bonus-chance: 0.15
  # Coins granted by the rare bonus
  bonus-coins: 150

# ---------------------------------------------------------------------------
# 7. COIN ECONOMY (STAKES, REWARDS & PENALTIES)
#    Player balances never drop below 0 Coins.
#    Customize Shop item prices in plugins/BosketBall/shop.yml!
# ---------------------------------------------------------------------------
economy:
  # End-of-match rewards & forfeit penalty (competitive 1v1 / 2v2 / 3v3 / 5v5)
  win-coins: 40
  loss-coins: 0
  forfeit-coins: 15
  mvp-bonus-coins: 15

  # NEW — Casual matches pay this fraction of the ranked rewards and never touch ELO
  casual-reward-multiplier: 0.40

  # Live on-court play rewards (competitive matches)
  two-point-coins: 5
  three-point-coins: 8
  dunk-bonus-coins: 3
  assist-coins: 4
  steal-coins: 4
  block-coins: 4

  # Solo & sportsmanship rewards
  three-point-contest-max-coins: 25
  gg-reward-coins: 5

# ---------------------------------------------------------------------------
# 8. 80HZ BALL PHYSICS & SKILL COOLDOWNS
# ---------------------------------------------------------------------------
physics:
  # Downward acceleration per tick (default: 0.046)
  gravity: 0.046

  # Air resistance multiplier per tick (0.90 = heavy drag, 0.999 = almost none)
  air-drag: 0.991

  # Bounce energy retained on court floor, backboard glass, and steel rim (0.10 - 0.95)
  floor-restitution: 0.76
  backboard-restitution: 0.66
  rim-restitution: 0.56

  # Skill move cooldowns (in milliseconds)
  steal-cooldown-ms: 1150
  crossover-cooldown-ms: 1650
  block-cooldown-ms: 900

# ---------------------------------------------------------------------------
# 9. CHAT FORMATTING, MODERATION, [+] / [-] JOIN-QUIT & POST-GAME CLEANUP
# ---------------------------------------------------------------------------
chat:
  # Enable BosketBall's single-line [Rank] [Tag] Player » message chat renderer
  enabled: true

  # Clean [+] join and [-] leave broadcast messages
  join-quit-messages: true
  join-format: "<dark_gray>[</dark_gray><#4ADE80><bold>+</bold></#4ADE80><dark_gray>]</dark_gray> <white>{player}</white>"
  quit-format: "<dark_gray>[</dark_gray><#F87171><bold>-</bold></#F87171><dark_gray>]</dark_gray> <gray>{player}</gray>"

  # Flush match play-by-play lines from chat when a game finishes or a player leaves court
  # While on court, chat is delivered to the match room only — never to the lobby.
  match-chat-isolated: true
  clear-after-match: true

  # Display Top-3 server leaderboard badges next to top players in chat
  show-top-stat-badges: true

  # Words automatically highlighted in gold when typed in chat
  highlight-keywords:
    - "GG"
    - "NICE SHOT"
    - "SPLASH"
    - "SWISH"
    - "DUNK"
    - "ANKLES"
    - "GREEN"

# ---------------------------------------------------------------------------
# 9B. CHAT MODERATION & ANTI-SPAM  [NEW]
# ---------------------------------------------------------------------------
moderation:
  # Profanity filter (French + English, evasion resistant)
  profanity-filter:
    enabled: true
    # The message is still delivered, only the offending words are censored with ███
    censor-character: "█"
    # Warn points added for a normal insult
    warn-points: 1
    # Warn points added for a severe insult / slur
    severe-warn-points: 2
    # Private feedback sent to the author (only they see it)
    notify-author: true
    # Staff are immune (OP / bosketball.staff)
    exempt-staff: true

  # Three warn points = automatic ban
  auto-ban-at-warnings: 3
  # Ban duration in hours when the warn threshold is reached
  ban-duration-hours: 24
  # The ban reason shown to the player (the Discord link is always appended)
  ban-reason: "Inappropriate language (3/3 chat warnings)"

  # Anti-spam rate limiting
  anti-spam:
    enabled: true
    # Minimum seconds between two messages
    min-seconds-between-messages: 1
    # Messages allowed inside the sliding window
    messages-per-window: 5
    window-seconds: 10
    # Seconds of temporary mute when the rate limit is tripped
    mute-seconds: 20
    # Block messages that are the same as the last one
    block-repeated-messages: true

  # Caps / shout filters
  block-caps: true
  caps-min-length: 8

  # Manual mutes applied by staff: default duration in minutes
  default-mute-minutes: 30

# ---------------------------------------------------------------------------
# 9C. DISCORD WEBHOOK FEED  [NEW]
# ---------------------------------------------------------------------------
discord:
  enabled: true
  webhook-url: "https://discord.com/api/webhooks/1567204269071794236/Soe7F_iZisrm4PKbFUKPpjgZXUJvSKZzltpo-wOGiC8DbxtRNnd3yQ24Bu4LGnbz-aIn"

  # What gets broadcast
  post-match-start: true
  post-score-updates: true
  post-match-results: true
  post-rank-ups: true
  post-crate-openings: true
  post-reports: true
  post-moderation-actions: true

  # Optional: public website used for player links (leave blank to disable thumbnails)
  player-head-url: "https://mc-heads.net/avatar/{uuid}/64"

# ---------------------------------------------------------------------------
# 10. LEADERBOARDS & HOLOGRAMS  [NEW]
# ---------------------------------------------------------------------------
leaderboards:
  # Wall holograms refresh interval in SECONDS (sorted in memory, no full scan)
  holo-refresh-seconds: 5
  # Interactive arrows cycle categories
  enable-category-arrows: true
  # Cache size per category
  cache-size: 10

# ---------------------------------------------------------------------------
# 11. TUTORIAL  [NEW]
# ---------------------------------------------------------------------------
tutorial:
  enabled: true
  # Never force it: the player must type /tuto or click the lobby hologram
  force-on-first-join: false
  # Show the reminder hologram above the guide station
  hologram-enabled: true
  # Steps reward
  completion-coins: 250
  completion-xp: 150
  # Teleport the player to the practice court for the shooting step
  use-practice-court: true

# ---------------------------------------------------------------------------
# 12. GUILDS / TEAMS  [NEW]
# ---------------------------------------------------------------------------
guilds:
  enabled: true
  # Cost to create a guild
  create-cost-coins: 1000
  max-members: 12
  tag-max-length: 6
  name-min-length: 3
  name-max-length: 16
  # Guild ELO starts here
  starting-elo: 1000

# ---------------------------------------------------------------------------
# 14. DATABASE / STORAGE  [NEW]
# ---------------------------------------------------------------------------
storage:
  # Interval between background dirty-profile disk flushes (in seconds)
  auto-save-interval-seconds: 30

  # Maximum recent match history entries stored per player
  max-match-history: 15

  # NEW — data backend. "yaml" keeps the human readable players/<uuid>.yml files,
  # "sqlite" or "mysql" mirror every profile & leaderboard into a real database.
  backend: "yaml"

  database:
    # SQLite file (created inside plugins/BosketBall/ when backend = sqlite)
    sqlite-file: "bosketball.db"
    # MySQL / MariaDB settings (used when backend = mysql)
    host: "127.0.0.1"
    port: 3306
    name: "bosketball"
    username: "root"
    password: ""
    # Connection pool size
    pool-size: 4
    # Mirror interval in seconds (profiles are always written to YAML too as a safety net)
    sync-interval-seconds: 60

  # NEW — automatic rotating backups of players/ & arenas.yml
  backups:
    enabled: true
    interval-hours: 12
    keep: 10

# =============================================================================
#  I18N — multi-language support (English is the base and default language)
# =============================================================================
i18n:
  enabled: true
  # Fallback language for consoles, new players and untranslated keys.
  # Available: en (base), fr, es, de
  default-locale: en
  # Translate system broadcasts (match start/end, rank ups) per player locale.
  translate-chat-broadcasts: true
