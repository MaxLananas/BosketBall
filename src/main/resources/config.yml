general:
  server-domain: "BOSKETBALL.FR"
  season-name: "ꜱᴀɪꜱᴏɴ ɪ • ᴄʜᴀᴏꜱ ᴄᴜʙᴇᴅ"
  auto-equip-lobby-playbook: true
  welcome-card-enabled: true

links:
  website: "https://bosketball.fr"
  shop: "https://shop.bosketball.fr"
  discord: "https://discord.gg/bosketball"

resource-pack:
  auto-send-on-join: true
  required: false
  # Serveur HTTP intégré léger pour distribuer automatiquement BosketBall-ResourcePack-26.2.zip
  embedded-http-server:
    enabled: false
    bind-address: "0.0.0.0"
    port: 8765
    public-host: "127.0.0.1"
  # URL externe prioritaire si renseignée (ex: GitHub Releases / CDN / MCPacks)
  external-url: ""
  external-sha1: "09ed80f871a77aa9aec6e651fbc2d2dc728e57f2"

match:
  quarters: 4
  quarter-seconds: 90
  overtime-seconds: 45
  shot-clock-seconds: 24
  offensive-rebound-shot-clock: 14
  countdown-seconds: 5
  celebration-ticks: 90
  on-fire-streak-threshold: 3
  target-score-1v1: 21

physics:
  gravity: 0.046
  air-drag: 0.991
  floor-restitution: 0.76
  backboard-restitution: 0.66
  rim-restitution: 0.56
  steal-cooldown-ms: 1150
  crossover-cooldown-ms: 1650
  block-cooldown-ms: 900

chat:
  enabled: true
  show-top-stat-badges: true
  highlight-keywords:
    - "GG"
    - "NICE SHOT"
    - "SPLASH"
    - "SWISH"
    - "DUNK"
    - "ANKLES"
    - "GREEN"
