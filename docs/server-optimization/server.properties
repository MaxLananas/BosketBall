#Minecraft server properties
# Optimised for BosketBall - Paper 26.2 / Java 25 - 6 GB RAM / 1.5 vCPU
# Every value below is documented in docs/server-optimization/README.md
# (Minecraft rewrites this file on boot and strips comments, so the diff lives in the README).
accepts-transfers=false
allow-flight=false
broadcast-console-to-ops=false
broadcast-rcon-to-ops=true
bug-report-link=
chat-spam-threshold-seconds=10
command-spam-threshold-seconds=10
debug=false
difficulty=peaceful
enable-code-of-conduct=false
enable-jmx-monitoring=false
enable-query=false
enable-rcon=false
enable-status=true
enforce-secure-profile=true
enforce-whitelist=false
entity-broadcast-range-percentage=80
force-gamemode=true
function-permission-level=2
gamemode=survival
generate-structures=false
generator-settings={"layers"\:[],"biome"\:"minecraft\:the_void","structures"\:{"structures"\:{}}}
hardcore=false
hide-online-players=false
initial-disabled-packs=
initial-enabled-packs=vanilla
level-name=world
level-seed=
level-type=minecraft\:flat
log-ips=false
management-server-allowed-origins=
management-server-enabled=false
management-server-host=localhost
management-server-port=0
management-server-secret=
management-server-tls-enabled=true
management-server-tls-keystore=
management-server-tls-keystore-password=
max-chained-neighbor-updates=1000000
max-players=60
max-tick-time=60000
max-world-size=29999984
# Plain, single-line banner served by the platform BEFORE BosketBall is enabled (the plugin
# replaces it with its own gradient banner as soon as the server answers pings).
motd=\u00a76\u2726 BOSKETBALL \u2726 \u00a78\u00b7 \u00a77WARMING UP \u00b7 BACK IN A MOMENT
network-compression-threshold=256
online-mode=true
op-permission-level=4
pause-when-empty-seconds=30
player-idle-timeout=0
prevent-proxy-connections=false
query.port=25092
rate-limit=0
rcon.password=
rcon.port=25575
region-file-compression=lz4
require-resource-pack=false
resource-pack=
resource-pack-id=
resource-pack-prompt=
resource-pack-sha1=
server-ip=0.0.0.0
server-port=25092
simulation-distance=4
spawn-protection=0
status-heartbeat-interval=0
sync-chunk-writes=false
text-filtering-config=
text-filtering-version=0
use-native-transport=true
view-distance=6
white-list=false
